# SPDX-License-Identifier: AGPL-3.0-or-later
# En cada cambio de main: pasa las pruebas. No publica: la web la publica
# solo el NAS (nas/), que tiene el estado y los registros. El NAS detecta los
# cambios de main en menos de un minuto (ADR 0005).
name: Proves

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proves:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Madrid
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install numpy pillow
      - run: python -m unittest discover -s tests
