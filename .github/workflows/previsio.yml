# SPDX-License-Identifier: AGPL-3.0-or-later
# En cada cambio de main: pasa las pruebas y publica la web en la rama
# gh-pages. Las actualizaciones programadas no se hacen aquí sino en el NAS
# (nas/), porque GitHub no lanzaba las programadas con puntualidad: ver el
# ADR 0005.
name: Previsió

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publica
  cancel-in-progress: false

jobs:
  publica:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Madrid
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install numpy pillow
      - name: Proves
        run: python -m unittest discover -s tests
      - name: Calcula i publica
        env:
          DESTINO: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: bash publica.sh
