# meteo-local en el NAS: calcula los datos de «Temps a Montflorit» cada cuarto
# de hora (en modo aviso, cada 6 minutos; config.py), con la hora local
# exacta, los sube a IONOS y publica la web; avisa por Telegram del peligro,
# de la lluvia inminente y de la riera.
#
#   docker compose up -d --build          construir y arrancar
#   docker compose logs -f                ver el reloj
#   docker exec meteo-local /usr/local/bin/reloj.sh --ara   publicar ya
#
# Fuera del contenedor, en /volume1/docker/meteo-local:
#   repo/   copia del repositorio (el reloj la pone al día antes de cada pasada)
#   home/   la clave de despliegue (.ssh), que solo da acceso a este repositorio,
#           el aviso por Telegram (.local/bin/avisar-juanjo y su configuración)
#           y las claves de la estación de casa (.config/meteo-local/ecowitt.env)
#   estat/  los últimos datos publicados (casa.json), la caché del radar y
#           registre/: lo medido en Montflorit y en la estación de casa, los
#           avisos de lluvia y los episodios de la riera, y
#           aprenentatge/: el modelo que usa la página (ADR 0012). Estos dos
#           se copian cada día en el repositorio privado meteo-local-registre
#           (nas/copia-registre.sh, ADR 0044); cómo volver a montarlo todo en
#           otro NAS, en nas/RESTAURAR.md
services:
  meteo-local:
    # La versión de Claude Code sale del archivo común del NAS
    # (/volume1/docker/versiones/versiones.env, enlazado aquí como .env), que el
    # actualizador semanal de vigilancia mantiene al día. Si falta, se usa la
    # que trae el Dockerfile.
    build:
      context: .
      args:
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-}
    image: meteo-local:local
    container_name: meteo-local
    restart: unless-stopped
    user: "1000:10"
    environment:
      TZ: Europe/Madrid
      HOME: /home/jjdeharo
      REGISTRE_DIR: /estat/registre
      APRENENTATGE_DIR: /estat/aprenentatge
      PATH: /home/jjdeharo/.local/bin:/usr/local/bin:/usr/bin:/bin
    cpus: 0.5
    # El token de Claude (claude setup-token), para todo el contenedor: lo
    # usan el actualizador semanal y la comprobación diaria de sesiones del
    # vigía; meteo-local ya no usa IA (ADR 0030). No está en el repositorio.
    # Y las claves de la estación de casa (Ecowitt, ADR 0017).
    env_file:
      - path: ./home/.config/meteo-local/claude.env
        required: false
      - path: ./home/.config/meteo-local/ecowitt.env
        required: false
    volumes:
      - ./repo:/proyecto
      - ./home:/home/jjdeharo
      - ./estat:/estat
